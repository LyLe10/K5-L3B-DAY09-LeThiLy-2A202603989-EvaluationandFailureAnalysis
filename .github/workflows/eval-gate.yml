name: lab9-eval-gate
on: [pull_request, workflow_dispatch]
permissions: {contents: read}
concurrency: {group: "eval-gate-${{ github.ref }}", cancel-in-progress: true}
jobs:
  # The starter repo has no src/lab8; its CI only runs after src/ of the Day 8 repo is copied into the fork.
  detect:
    runs-on: ubuntu-latest
    outputs: {lab8: "${{ steps.has.outputs.lab8 }}"}
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - id: has
        run: "test -d src/lab8 && echo lab8=1 >> \"$GITHUB_OUTPUT\" || echo skip, overlay without src/lab8"

  eval-gate:
    needs: detect
    if: needs.detect.outputs.lab8
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      EVAL_SPEC: config/metric_spec.yaml
      # Committed by the student after M4 (re-run on main, never hand-edited).
      EVAL_BASELINE: reports/baseline_v1.json
    defaults: {run: {working-directory: src}}
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      # setup-uv publishes only full tags (no @v10); pin the SHA.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: {python-version: "3.13", activate-environment: true, enable-cache: true, cache-dependency-glob: "src/requirements*.txt"}
      - run: uv pip install -r requirements.txt -r requirements-lab9.txt
      - run: python -m lab9.smoke
      - run: python -m pytest -q -m student -o addopts= -k "lab9 and not advanced"
      - run: python -m lab9.evalset --check
      - name: Evaluate and gate the PR swarm
        shell: bash
        run: |
          python -m lab9.eval --shape swarm --spec "$EVAL_SPEC" --out reports/eval_pr.json
          python -m lab9.gate --pr reports/eval_pr.json --baseline "$EVAL_BASELINE" --spec "$EVAL_SPEC"
      - name: Check the committed baseline and the M3 metric
        run: python -m lab9.ci_check --pr reports/eval_pr.json --baseline "$EVAL_BASELINE" --spec "$EVAL_SPEC"
      - name: Verify the gate accepts fixed
        shell: bash
        run: |
          python -m lab9.eval --shape fixed --spec "$EVAL_SPEC" --out reports/eval_fixed.json
          python -m lab9.gate --pr reports/eval_fixed.json --baseline "$EVAL_BASELINE" --spec "$EVAL_SPEC"
      - name: Verify the gate blocks seeded_regression
        shell: bash
        run: |
          python -m lab9.eval --shape seeded_regression --spec "$EVAL_SPEC" --out reports/eval_seeded_regression.json
          gate_status=0
          gate_output=$(python -m lab9.gate --pr reports/eval_seeded_regression.json --baseline "$EVAL_BASELINE" --spec "$EVAL_SPEC") || gate_status=$?
          printf '%s\n' "$gate_output"
          # A Python exception can also exit 1. Require the explicit pass_rate verdict.
          if [[ "$gate_status" -ne 1 ]] || ! grep -Eq '^exit 1 — blocked: ([^,]+, )*pass_rate(, |$)' <<< "$gate_output"; then
            echo "Expected the gate to block seeded_regression on pass_rate with exit 1 (got $gate_status)."
            exit 1
          fi

  # Classify against a trusted base before deciding whether v2 may be skipped.
  eval-gate-v2:
    needs: eval-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env: {PYTHONUTF8: "1"}
    defaults: {run: {working-directory: src}}
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Resolve trusted base commit
        id: trusted_base
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              base_sha="$PR_BASE_SHA"
              ;;
            workflow_dispatch)
              api_default=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
              if [[ -z "$DEFAULT_BRANCH" || "$api_default" != "$DEFAULT_BRANCH" ]]; then
                echo "Cannot verify the default branch." >&2
                exit 1
              fi
              encoded_branch=$(python -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["DEFAULT_BRANCH"], safe=""))')
              branch_info=$(gh api "repos/$GITHUB_REPOSITORY/branches/$encoded_branch")
              if ! jq -e '.protected == true' <<< "$branch_info" > /dev/null; then
                echo "Default branch must be protected for trusted dispatch." >&2
                exit 1
              fi
              base_sha=$(jq -er '.commit.sha' <<< "$branch_info")
              ;;
            *) echo "Unsupported event for trusted base spec." >&2; exit 1 ;;
          esac
          if [[ ! "$base_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Trusted base SHA is missing or invalid." >&2
            exit 1
          fi
          echo "sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "Trusted base SHA: $base_sha"
      - name: Checkout trusted base commit
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.trusted_base.outputs.sha }}
          path: _trusted_base
          persist-credentials: false
      - name: Classify submission from verified trees
        id: has
        shell: bash
        env:
          BASE_SHA: ${{ steps.trusted_base.outputs.sha }}
          EVALUATED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast, os, pathlib, re, subprocess, sys

          root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          base = os.environ['BASE_SHA']
          head = os.environ['EVALUATED_SHA']
          def fail(message):
              sys.exit('UNKNOWN: ' + message)
          def git(*args, cwd=root):
              try:
                  return subprocess.run(['git', *args], cwd=cwd, check=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE).stdout
              except (OSError, subprocess.CalledProcessError) as exc:
                  fail('git command failed: ' + str(exc))
          if not all(re.fullmatch(r'[0-9a-f]{40}', x) for x in (base, head)):
              fail('missing or invalid snapshot SHA')
          if git('rev-parse', 'HEAD').decode().strip() != head:
              fail('evaluated checkout SHA mismatch')
          if git('rev-parse', 'HEAD', cwd=root / '_trusted_base').decode().strip() != base:
              fail('trusted checkout SHA mismatch')
          # Import only the verified commit object; the diff compares exact trees.
          git('fetch', '--no-tags', str(root / '_trusted_base'), base)
          raw = git('diff', '--name-status', '-z', '--find-renames', base, head, '--')
          tokens = raw.split(b'\0')
          if tokens.pop() != b'':
              fail('unterminated diff')
          changes = []
          while tokens:
              status = tokens.pop(0).decode('ascii', 'strict')
              if not re.fullmatch(r'(?:[AMDT]|[RC][0-9]+)', status):
                  fail('unrecognized diff status ' + status)
              n = 2 if status[0] in 'RC' else 1
              if len(tokens) < n:
                  fail('truncated diff')
              paths = [os.fsdecode(tokens.pop(0)) for _ in range(n)]
              changes.extend(paths)
          outputs = ['src/data/eval/eval_set_v2.jsonl', 'src/data/eval/labels_v2.json', 'src/reports/baseline_v2.json']
          configs = ['src/config/fm_map.yaml', 'src/config/metric_spec_v2.yaml']
          tests = ['src/tests/test_lab9_m5.py', 'src/tests/test_lab9_m6.py', 'src/tests/test_lab9_m7.py']
          shared = {'src/lab9/gate.py': {'slice_check', 'integrity_check'}, 'src/lab9/stats.py': {'pass_at_k', 'pass_hat_k'}}
          def entry(commit, path):
              data = git('ls-tree', '-z', commit, '--', path)
              if not data:
                  return None
              records = data.split(b'\0')
              if len(records) != 2 or records[-1] != b'':
                  fail('invalid tree entry: ' + path)
              meta, name = records[0].split(b'\t', 1)
              if os.fsdecode(name) != path:
                  fail('unexpected tree path: ' + path)
              mode, kind, _ = meta.decode('ascii').split()
              if mode not in ('100644', '100755') or kind != 'blob':
                  fail('non-regular file: ' + path)
              return mode
          def functions(commit, path):
              if entry(commit, path) is None:
                  fail('missing shared source: ' + path)
              try:
                  tree = ast.parse(git('show', commit + ':' + path))
              except (SyntaxError, ValueError) as exc:
                  fail('cannot parse shared source: ' + str(exc))
              found = {}
              for node in tree.body:
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name in shared[path]:
                      if node.name in found:
                          fail('duplicate function: ' + node.name)
                      found[node.name] = ast.dump(node, include_attributes=False)
              if set(found) != shared[path]:
                  fail('missing dedicated function: ' + path)
              return found
          # These outputs and dedicated tests are not part of the Core starter.
          # Read every entry even after a signal is found, so malformed types fail.
          observed = {(c, p): entry(c, p) for c in (base, head) for p in outputs + configs + tests}
          signal = any(observed[c, p] is not None for c in (base, head) for p in outputs + tests)
          signal |= any(p in changes for p in outputs + configs + tests)
          for path in shared:
              if path in changes:
                  signal |= functions(base, path) != functions(head, path)
          uncertain = any(p in changes for p in [*shared, 'docs/eval_card.md'])
          if not signal:
              if uncertain:
                  fail('shared code or eval card changed without an identifiable Advanced signal')
              print('CORE_ONLY: no Advanced signals in verified snapshots; v2 skipped')
          else:
              required = outputs + configs + ['src/lab9/gate.py', 'src/lab9/stats.py', 'docs/eval_card.md'] + tests
              missing = [p for p in required if entry(head, p) is None]
              if missing:
                  sys.exit('ADVANCED: missing required artifacts: ' + ', '.join(missing))
              print('ADVANCED: required paths present; running v2 validation')
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
                  out.write('v2=1\n')
          PY
      - if: steps.has.outputs.v2
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: {python-version: "3.13", activate-environment: true, enable-cache: true, cache-dependency-glob: "src/requirements*.txt"}
      - if: steps.has.outputs.v2
        run: uv pip install -r requirements.txt -r requirements-lab9.txt
      - name: Validate trusted base spec
        if: steps.has.outputs.v2
        shell: bash
        env:
          EXPECTED_BASE_SHA: ${{ steps.trusted_base.outputs.sha }}
        run: |
          set -euo pipefail
          actual_sha=$(git -C "$GITHUB_WORKSPACE/_trusted_base" rev-parse HEAD)
          if [[ "$actual_sha" != "$EXPECTED_BASE_SHA" ]]; then
            echo "Trusted checkout does not match the requested base SHA." >&2
            exit 1
          fi
          source_spec="$GITHUB_WORKSPACE/_trusted_base/src/config/metric_spec_v2.yaml"
          if [[ ! -f "$source_spec" || -L "$source_spec" ]]; then
            echo "Trusted base spec is missing or is a symlink; bootstrap review required." >&2
            exit 1
          fi
          cp -- "$source_spec" "$RUNNER_TEMP/base_metric_spec_v2.yaml"
          echo "Trusted base SHA: $actual_sha"
          sha256sum "$RUNNER_TEMP/base_metric_spec_v2.yaml"
          python -c 'import os, pathlib, yaml; base=yaml.safe_load(pathlib.Path(os.environ["RUNNER_TEMP"], "base_metric_spec_v2.yaml").read_text(encoding="utf-8")); pr=yaml.safe_load(pathlib.Path("config/metric_spec_v2.yaml").read_text(encoding="utf-8")); bv=base.get("eval_set_version") if isinstance(base, dict) else None; pv=pr.get("eval_set_version") if isinstance(pr, dict) else None; assert isinstance(bv, str) and bv and bv == pv, "Missing or mismatched eval_set_version; migration review required"; print("Verified eval_set_version:", bv)'
      - if: steps.has.outputs.v2
        run: python -m pytest -q -m student -o addopts= -k advanced
      - if: steps.has.outputs.v2
        run: python -m pytest -q -o addopts= tests/test_lab9_m5.py tests/test_lab9_m6.py tests/test_lab9_m7.py
      - if: steps.has.outputs.v2
        run: python -m lab9.evalset --v2
      - if: steps.has.outputs.v2
        run: python -m lab9.mutation --spec config/metric_spec_v2.yaml --baseline reports/baseline_v2.json --base-spec "$RUNNER_TEMP/base_metric_spec_v2.yaml"
